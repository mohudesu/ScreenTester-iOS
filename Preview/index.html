ght:18px;border:1.5px solid var(--secondary);border-radius:50%;display:grid;place-items:center;color:transparent;font-size:11px;font-weight:700}.choice[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:-2px}.choice[aria-pressed=true] .check{color:var(--bg);background:var(--accent);border-color:var(--accent)}.current{font-size:12px;margin:14px 0 0;color:var(--secondary)}.settings-panel{padding:22px;margin:24px 0}.settings-panel h3{font-size:17px;margin:0 0 18px}.value{font-size:26px;font-weight:600;color:var(--accent);margin:0 0 18px;display:block}.range{appearance:none;-webkit-appearance:none;width:100%;height:44px;margin:0 0 14px;background:transparent;accent-color:var(--accent);cursor:pointer}.range::-webkit-slider-runnable-track{height:5px;background:var(--field);border-radius:5px}.range::-webkit-slider-thumb{appearance:none;width:29px;height:25px;border-radius:20px;background:white;box-shadow:0 3px 12px #19394d33;margin-top:-10px}.colors{display:flex;border-radius:30px;background:var(--field);padding:3px;gap:2px;margin-bottom:16px}.colors button{flex:1;border:0;background:none;border-radius:25px;padding:7px 0;color:var(--ink);font-size:12px}.colors button[aria-pressed=true]{background:#5394bc44}.settings-panel p{margin:0;font-size:12px;color:var(--secondary);line-height:1.75}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.switch-row h3{margin:0}.switch{width:51px;height:30px;border:0;border-radius:24px;background:#a3b0bc;padding:3px;flex-shrink:0}.switch:before{content:"";display:block;width:24px;height:24px;background:white;border-radius:50%;box-shadow:0 1px 4px #19374922;transition:transform .2s}.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true]:before{transform:translateX(21px)}.full-test{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;background:#000;color:#fff;border:2px solid white;border-radius:52px;user-select:none;-webkit-user-select:none;touch-action:none}.full-test h3{font-size:23px}.full-test p{font-size:15px;line-height:1.75}.full-test small{position:absolute;bottom:65px;font-size:13px}.full-test.visible{display:flex}.preview-message{position:absolute;left:26px;right:26px;bottom:36px;z-index:10;background:#122c3deb;color:#fff;border:1px solid #abd5dd55;border-radius:18px;padding:16px;line-height:1.6;font-size:13px;box-shadow:0 12px 35px #0003;display:none}.preview-message.visible{display:block}.preview-message button{border:0;color:#8fe0ef;background:none;font-size:13px;padding:7px 0 0}.app[data-large=true] .grid,.app[data-large=true] .choices{grid-template-columns:1fr}.app[data-large=true] .card h4{font-size:21px}.app[data-large=true] .card p,.app[data-large=true] .settings-panel p{font-size:16px}.app[data-large=true] .choice strong{font-size:20px}.app[data-large=true] .choice small{font-size:16px}.app[data-large=true] .heading{align-items:flex-start}.app[data-large=true] .heading h2{font-size:31px;overflow-wrap:anywhere}.app[data-large=true] .style-picker h3{font-size:23px}body[data-reduce-motion=true] *{transition:none!important;animation:none!important}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media(max-width:850px){.shell{grid-template-columns:1fr;gap:24px;padding:28px 12px;justify-items:center}.intro{max-width:402px;padding:0}.intro h1{font-size:29px;margin:16px 0 10px}.intro p{max-width:none}.note,.version{display:none}.preview-controls{margin:18px 0}.phone{width:min(418px,100%);height:min(896px,calc(100vw * 2.18));min-height:690px;border-width:6px;border-radius:52px}.heading h2{font-size:28px}.scroll{padding-left:22px;padding-right:22px}}@media(max-width:390px){.scroll{padding-left:17px;padding-right:17px}.heading h2{font-size:25px}.grid{gap:14px}.card{padding:15px}.card h4{font-size:15px}.hero{padding:20px}.choice{padding:14px}.choices{gap:12px}}

<main class="shell">
  <section class="intro">
    <div class="kicker"><span class="dot"></span>SCREENTESTER / LOCAL PREVIEW</div>
    <h1>两种质感，<br>一个屏幕实验室。</h1>
    <p>保留熟悉的新拟态，加入清透的 <strong>Liquid Glass</strong>。在预览右上角打开设置，即可切换界面风格。</p>
    <div class="preview-controls" aria-label="预览显示选项">
      <button id="dark-toggle" aria-pressed="false">深色预览</button>
      <button id="large-toggle" aria-pressed="false">大字预览</button>
      <button id="opaque-toggle" aria-pressed="false">减少透明度</button>
    </div>
    <p class="note">这是用于比较布局与配色的网页预览。iOS 26 原生玻璃折射、系统动画和检测精度需在 Mac / iPhone 上验证；此页面不是 iOS 运行截图。</p>
    <div class="version">v0.3.0 · 本地开发版 · 未上传 GitHub</div>
  </section>
  <section class="phone" aria-label="iPhone 界面预览">
    <div class="app" id="app" data-style="liquidGlass" data-color="light">
      <div class="backdrop"></div>
      <div class="status"><span>9:41</span><div class="island"></div><div class="signals"><span>▮▮▮</span><span>◉</span><i class="battery"></i></div></div>
      <div class="scroll" id="page"></div>
      <div class="home-indicator"></div>
      <div class="full-test" id="test"><div><h3>黑边遮挡测试</h3><p>描边 <span id="test-width">2</span> px<br>圆角为手动校准值<br>长按 2 秒退出</p></div><small>长按 2 秒或按 Esc 返回预览</small></div>
      <div class="preview-message" id="message"><div id="message-text"></div><button id="message-close">知道了</button></div>
    </div>
  </section>
</main>
<script>
'use strict';
const app = document.getElementById('app'), page = document.getElementById('page');
const initial = {style:'liquidGlass',width:2,ppi:460,color:'白',bright:false};
let settings = {...initial};
try { const saved = JSON.parse(localStorage.getItem('screentester-preview-v030') || '{}'); if(['neumorphic','liquidGlass'].includes(saved.style)) settings = {...initial,...saved}; } catch {}
let screen = 'home', homeOffset = 0, holdTimer;
const save = () => { try {localStorage.setItem('screentester-preview-v030',JSON.stringify(settings));} catch {} };
const glyphs = {
  settings:'<path d="M4 6h8m4 0h4M4 12h3m4 0h9M4 18h10m4 0h2"/><circle cx="14" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 4h4m-4 16h4"/>',
  ruler:'<rect x="2" y="7" width="20" height="10" rx="1"/><path d="M6 7v5m4-5v3m4-3v5m4-5v3"/>',
  corners:'<path d="M3 8V5a2 2 0 0 1 2-2h3m8 0h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3m-8 0H5a2 2 0 0 1-2-2v-3"/>',
  color:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>',
  gray:'<circle cx="12" cy="12" r="9"/><path d="M3 12a9 9 0 0 0 18 0Z" fill="currentColor"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/>',
  bars:'<path d="M3 21h18M5 17V9h3v8zm6 0V4h3v13zm6 0v-6h3v6z" fill="currentColor"/>',
  sparkle:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/>',
  grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/>',
  touch:'<path d="M9 12V5a2 2 0 0 1 4 0v7-3a2 2 0 0 1 4 0v3-1a2 2 0 0 1 4 0v5a6 6 0 0 1-6 6h-1c-3 0-5-3-7-5l-3-4a2 2 0 0 1 3-2l2 2"/>',
  wave:'<path d="M1 12h4l3-7 4 14 4-10 3 3h4"/>',
  stack:'<path d="m12 3 10 5-10 5L2 8Zm-10 9 10 5 10-5M2 16l10 5 10-5"/>',
  drop:'<path d="M12 2S4 10 4 15a8 8 0 0 0 16 0c0-5-8-13-8-13Z"/><path d="M8 15a4 4 0 0 0 4 4"/>',
  back:'<path d="m15 4-8 8 8 8"/>'
};
const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${glyphs[name] || glyphs.sparkle}</svg>`;
const groups = [
 ['边缘与校准',[['ruler','像素精度测试','逐像素观察遮挡'],['corners','圆角校准','让四个圆角贴合']]],
 ['色彩与显示',[['color','色彩与坏点','纯色检查面板'],['gray','灰阶过渡','观察明暗过渡'],['sun','白平衡','检查灰色均匀度'],['bars','彩条测试','观察色块与色阶'],['sparkle','HDR 能力信息','查看系统显示能力']]],
 ['触控与响应',[['grid','触控网格','划过每一个格子'],['touch','多指触控','查看同时触点数'],['wave','触控事件频率','观察触摸事件频率']]]
];
function home() {
  screen='home';
  page.innerHTML = `<header class="heading"><div><div class="eyebrow">SCREEN LAB</div><h2>ScreenTester</h2></div><button class="surface settings-button" id="open-settings" aria-label="测试设置">${icon('settings')}</button></header><p class="tagline">看清每一处细节。</p><button class="surface hero" id="start-test">${icon('phone')}<div class="tag">从屏幕边缘开始</div><h3>黑边遮挡测试</h3><p>点亮屏幕轮廓，观察钢化膜是否遮住显示区域。</p><span class="start">开始检测 <span>↗</span></span></button>${groups.map(([title,items])=>`<section class="section"><h3>${title}</h3><div class="grid">${items.map(([symbol,title,detail])=>`<button class="surface card" data-preview-title="${title}">${icon(symbol)}<h4>${title}</h4><p>${detail}</p></button>`).join('')}</div></section>`).join('')}<button class="surface help" id="help"><h4>轻点切换 · 长按退出</h4><p>测试时长按 2 秒返回。查看操作说明与测量限制。</p></button><p class="footer">ScreenTester iOS · mohudesu</p>`;
  page.scrollTop=homeOffset;
  document.getElementById('open-settings').onclick=()=>{homeOffset=page.scrollTop;showSettings();};
  document.getElementById('start-test').onclick=()=>{document.getElementById('test-width').textContent=settings.width;document.getElementById('test').classList.add('visible');};
  page.querySelectorAll('[data-preview-title]').forEach(b=>b.onclick=()=>message(`${b.dataset.previewTitle}：该网页展示界面风格，实际检测功能在 iOS 工程中。`));
  document.getElementById('help').onclick=()=>message('全屏检测长按 2 秒退出。网页预览不提供硬件测量，也不验证单像素精度。');
}
function showSettings(offset=0) {
  screen='settings';
  page.innerHTML=`<nav class="nav"><button class="back" id="back">${icon('back')}返回</button><span>测试设置</span></nav><h2 class="settings-title">调到刚刚好。</h2><p class="settings-description">参数会自动保存，下一次测试继续使用。</p><section class="style-picker"><h3>界面风格</h3><div class="choices">${[['neumorphic','新拟态','柔和浮雕','stack'],['liquidGlass','Liquid Glass','清透流光','drop']].map(([key,title,detail,symbol])=>`<button class="surface choice" data-style-choice="${key}" aria-pressed="${settings.style===key}"><div class="top">${icon(symbol)}<span class="check">✓</span></div><strong>${title}</strong><small>${detail}</small></button>`).join('')}</div><p class="current" id="style-value">当前：${settings.style==='liquidGlass'?'Liquid Glass':'新拟态'}</p></section><section class="surface settings-panel"><h3>描边与颜色</h3><output class="value" id="width-value">${settings.width} px</output><input class="range" type="range" min="1" max="12" step="1" value="${settings.width}" id="width" aria-label="描边宽度"><div class="colors">${['白','绿','红','青','黄'].map(color=>`<button data-border-color="${color}" aria-pressed="${settings.color===color}">${color}</button>`).join('')}</div><p>1–12 像素。细线适合观察边缘，粗线更容易辨认。</p></section><section class="surface settings-panel"><div class="switch-row"><h3>临时最高亮度</h3><button class="switch" id="brightness" role="switch" aria-label="临时最高亮度" aria-checked="${settings.bright}"></button></div><p>进入测试时提高亮度，退出测试或进入后台后恢复。</p></section><section class="surface settings-panel"><h3>像素密度</h3><output class="value" id="ppi-value">${settings.ppi} ppi</output><input class="range" type="range" min="200" max="650" value="${settings.ppi}" id="ppi" aria-label="像素密度"><p>iPhone 17 默认 460 ppi。仅用于毫米换算，不代表测量精度。</p></section><section class="surface settings-panel"><h3>圆角校准</h3><p>返回首页打开「圆角校准」，实时调整四个角。所有设置仅保存在本机。</p></section>`;
  page.scrollTop=offset;
  document.getElementById('back').onclick=home;
  page.querySelectorAll('[data-style-choice]').forEach(b=>b.onclick=()=>{const y=page.scrollTop;settings.style=b.dataset.styleChoice;save();apply();showSettings(y);page.querySelector(`[data-style-choice="${settings.style}"]`).focus({preventScroll:true});});
  ['width','ppi'].forEach(key=>{document.getElementById(key).oninput=e=>{settings[key]=Number(e.target.value);document.getElementById(`${key}-value`).textContent=`${settings[key]} ${key==='width'?'px':'ppi'}`;save();};});
  page.querySelectorAll('[data-border-color]').forEach(b=>b.onclick=()=>{settings.color=b.dataset.borderColor;page.querySelectorAll('[data-border-color]').forEach(c=>c.setAttribute('aria-pressed',c===b));save();});
  document.getElementById('brightness').onclick=e=>{settings.bright=!settings.bright;e.currentTarget.setAttribute('aria-checked',settings.bright);save();};
}
function apply(){app.dataset.style=settings.style;}
function message(text){document.getElementById('message-text').textContent=text;document.getElementById('message').classList.add('visible');}
document.getElementById('message-close').onclick=()=>document.getElementById('message').classList.remove('visible');
for(const [id,key] of [['dark-toggle','color'],['large-toggle','large'],['opaque-toggle','opaque']]) document.getElementById(id).onclick=e=>{const next=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',next);app.dataset[key]=key==='color'?(next?'dark':'light'):String(next);};
const test=document.getElementById('test');
test.onpointerdown=()=>{holdTimer=setTimeout(()=>test.classList.remove('visible'),2000);};
for(const event of ['pointerup','pointercancel','pointerleave'])test.addEventListener(event,()=>clearTimeout(holdTimer));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){test.classList.remove('visible');document.getElementById('message').classList.remove('visible');}});
apply();home();
</script>
</html>
