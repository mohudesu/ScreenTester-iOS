name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ScreenTester/**'
      - 'ScreenTester.xcodeproj/**'
      - 'build-ipa.command'
      - 'test-ui.command'
      - 'UITests/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile iPhone app on macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check project and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -f build-ipa.command
          test -f ScreenTester.xcodeproj/project.pbxproj
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          plutil -lint ScreenTester/Info.plist
          plutil -lint ScreenTester.xcodeproj/project.pbxproj

      - name: Verify UI in iPhone simulator
        shell: bash
        run: bash test-ui.command

      - name: Build and package unsigned IPA
        shell: bash
        run: bash build-ipa.command

      - name: Upload IPA for download
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTester-unsigned-IPA
          path: |
            output/ScreenTester-unsigned-*.ipa
            output/ScreenTester-unsigned-*.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Save build logs even if compilation failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTester-build-logs
          path: output/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save interface screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ScreenTester-interface-previews
          path: output/ui-screenshots/
          if-no-files-found: ignore
          retention-days: 7
